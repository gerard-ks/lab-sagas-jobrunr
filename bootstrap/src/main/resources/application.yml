spring:
  config:
    import:
      - classpath:/order-module.yml
      - classpath:/inventory-module.yml
      - classpath:/platform-module.yml
      - classpath:/notification-module.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/lab_db
    username: lab_user
    password: lab_password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: infra_schema, order_schema, inventory_schema, notification_schema
    locations: classpath:db/migration/order, classpath:db/migration/inventory, classpath:db/migration/platform, classpath:db/migration/notification

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true     # Tu pourras voir tes jobs sur http://localhost:8000
  database:
    skip-create: false
    table-prefix: infra_schema. # Force JobRunr à créer ses tables dans l'infra_schema !
    type: sql

chaos:
  monkey:
    force-stock-fail: false # Si false : Succès total. Si true : Rollback Saga !